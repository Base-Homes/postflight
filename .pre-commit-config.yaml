# Optional for contributors, authoritative in CI — the same two commands run in both,
# so a green pre-commit means a green lint job.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
        # Markdown too: ruff formats fenced python, so a README example drifts from the
        # house style otherwise — and the CI job runs repo-wide, so scoping the hook
        # narrower is how local and CI end up disagreeing.
        types_or: [python, pyi, markdown]
      - id: ruff-format
        types_or: [python, pyi, markdown]
