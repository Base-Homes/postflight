name: Release

# Publishing a GitHub Release is the gate. Not a tag push: a tag is cheap to create by
# accident and impossible to take back once it has reached PyPI, whereas a Release is a
# deliberate act with the notes in front of you.
#
# The `pypi` environment below is the second gate, and the stronger one — it pauses the
# run BEFORE the OIDC token is minted. Environment protection rules are unavailable on a
# private repo under this plan, so it currently holds none; add a required reviewer once
# the repo is public and this becomes belt-and-braces.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - run: pip install --upgrade build twine
      - run: python -m build
      # --strict fails on a README that PyPI would render badly, which is otherwise
      # only discovered after the version is burned and unrepublishable.
      - run: python -m twine check --strict dist/*
      # The marker is invisible to a consumer's type checker if it misses the wheel, and
      # nothing else would notice. tests/ checks the source tree; this checks the artifact.
      - name: py.typed is in the wheel
        run: python -m zipfile -l dist/*.whl | grep -q 'postflight/py.typed'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/postflight
    # The ONLY permission this job gets. It deliberately does not check out the repo, so
    # the job holding the publishing identity never executes repository code.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Trusted Publishing (OIDC) — no API token exists to leak or rotate. PEP 740
      # attestations are generated and uploaded automatically since v1.11.0; an explicit
      # sigstore signing job would be duplicative.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Attaching the built artifacts to the Release that triggered this. Its own job so the
  # publish job keeps `id-token: write` as its ONLY permission — `contents: write` has no
  # business sitting alongside the publishing identity.
  attach-artifacts:
    needs: [publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
