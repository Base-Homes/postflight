version: 2
updates:
  # Actions only — the package has no runtime dependencies to update, which is the
  # point of it. `directory` is always "/" for github-actions, never the workflows path.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One PR a week rather than one per action. Dependabot rewrites the SHA pin and
      # its trailing version comment together.
      actions:
        patterns: ["*"]
